<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">App2Reel — Your app. Ready for its close-up.</title>
  <desc id="desc">A product URL and brief become a recorded demo and an animated launch film. Local rendering, powered by your Codex subscription.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#202421"/><stop offset="1" stop-color="#101412"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs>
  <rect width="1280" height="640" rx="24" fill="url(#bg)"/><rect width="1280" height="640" rx="24" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="64" y="55" width="34" height="34" rx="8" fill="#e85b32"/><path d="m77 64 13 8-13 8z" fill="#fffefa"/>
    <text x="112" y="81" fill="#fffefa" font-size="30" font-weight="700" letter-spacing="-1">App2Reel<tspan fill="#e85b32">.</tspan></text>
    <text x="65" y="163" fill="#d58b6e" font-size="13" font-weight="700" letter-spacing="3">THE OPEN-SOURCE PRODUCT FILM STUDIO</text>
    <text x="62" y="237" fill="#fffefa" font-size="65" font-weight="700" letter-spacing="-2">Your app.</text>
    <text x="62" y="311" fill="#fffefa" font-size="65" font-weight="700" letter-spacing="-2">Ready for its close-up.</text>
    <text x="65" y="357" fill="#aab5a5" font-size="20">A product URL + a brief → a demo and a launch film.</text>
    <g transform="translate(64 414)">
      <rect width="314" height="111" rx="12" fill="#2d342d" stroke="#475142"/>
      <text x="22" y="32" fill="#93a28b" font-size="11" letter-spacing="2">01 / THE INPUT</text>
      <text x="22" y="66" fill="#fffefa" font-size="22" font-weight="700">Product URL + brief</text>
      <text x="22" y="91" fill="#aab5a5" font-size="14">Tell the story worth showing.</text>
      <path d="M337 56h37m-9-8 9 8-9 8" fill="none" stroke="#e85b32" stroke-width="2"/>
      <rect x="398" width="314" height="111" rx="12" fill="#2d342d" stroke="#475142"/>
      <text x="420" y="32" fill="#93a28b" font-size="11" letter-spacing="2">02 / THE WALKTHROUGH</text>
      <text x="420" y="66" fill="#fffefa" font-size="22" font-weight="700">Recorded product demo</text>
      <text x="420" y="91" fill="#aab5a5" font-size="14">Real browser footage. Your edit.</text>
      <text x="738" y="65" fill="#e85b32" font-size="30">+</text>
      <rect x="784" width="368" height="111" rx="12" fill="#e85b32"/>
      <text x="806" y="32" fill="#ffe7db" font-size="11" letter-spacing="2">03 / THE LAUNCH FILM</text>
      <text x="806" y="66" fill="#fffefa" font-size="22" font-weight="700">Animated product promo</text>
      <text x="806" y="91" fill="#ffe7db" font-size="14">Motion, narration, and your brand.</text>
    </g>
    <text x="65" y="583" fill="#aab5a5" font-size="14">LOCAL RENDERING</text><circle cx="234" cy="578" r="2" fill="#e85b32"/>
    <text x="252" y="583" fill="#aab5a5" font-size="14">YOUR CODEX SUBSCRIPTION</text><circle cx="487" cy="578" r="2" fill="#e85b32"/>
    <text x="505" y="583" fill="#aab5a5" font-size="14">MIT LICENSED</text>
    <text x="1215" y="583" fill="#798772" font-size="14" text-anchor="end">github.com/jntv/app2reel</text>
  </g>
</svg>
