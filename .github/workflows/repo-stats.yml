name: Repository stats

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: repository-stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Record current repository counts
        run: node scripts/github-stats.mjs --output .capture/repo-stats.json
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retain dated snapshot
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: repo-stats-${{ github.run_id }}
          path: .capture/repo-stats.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
