name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Bound package downloads and use the main Ubuntu mirror
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo tee /etc/apt/apt.conf.d/zzzz-app2reel-ci >/dev/null <<'APT'
          Acquire::Retries "2";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APT
          apt-config shell app2reel_retries Acquire::Retries app2reel_http_timeout Acquire::http::Timeout app2reel_https_timeout Acquire::https::Timeout
      - name: Install browser and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Install system narration for speech integration tests
        run: sudo apt-get install --yes espeak-ng
      - name: Check local runtime
        run: pnpm run doctor
      - name: Test
        run: pnpm test
      - name: Build and typecheck
        run: pnpm run build
